# LCCC coming-soon page for lccc.lu (while the new site is developed at beta.lccc.lu).
# On the server: git clone this repo, cd into it, create .env (see README), docker compose up -d
# To update the page: git pull. After changes to api/ or this file: docker compose up -d --force-recreate
services:
  web:
    image: nginx:alpine
    container_name: lccc_placeholder
    depends_on:
      - api
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    networks:
      - default
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.lccc-placeholder.rule=Host(`lccc.lu`) || Host(`www.lccc.lu`)"
      - "traefik.http.routers.lccc-placeholder.entrypoints=websecure"
      - "traefik.http.routers.lccc-placeholder.tls=true"
      - "traefik.http.routers.lccc-placeholder.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lccc-placeholder.tls.domains[0].main=lccc.lu"
      - "traefik.http.routers.lccc-placeholder.tls.domains[0].sans=www.lccc.lu"
      - "traefik.http.services.lccc-placeholder.loadbalancer.server.port=80"

  # Vendor interest form (POST /api/interest): saves sign-ups in ./data and sends the emails
  api:
    image: node:22-alpine
    container_name: lccc_placeholder_api
    command: node /app/server.js
    volumes:
      - ./api:/app:ro
      - ./data:/data
    environment:
      - NOTIFY_TO=${NOTIFY_TO:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_VENDORS=${MAIL_FROM_VENDORS:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-}
    restart: always
    networks:
      - default

networks:
  traefik_default:
    external: true
