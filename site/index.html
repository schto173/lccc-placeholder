<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCCC — Luxembourg Cards &amp; Collectibles</title>
    <meta name="description" content="LCCC, Luxembourg's convention for trading card games and collectibles. Our new website is coming soon." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        :root {
            --purple: #4b2d8f;
            --purple-dark: #2d1660;
            --gold: #f5c518;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 16px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #fff;
            background: linear-gradient(160deg, var(--purple) 0%, var(--purple-dark) 100%);
        }

        img {
            width: 240px;
            max-width: 70vw;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
        }

        .badge {
            display: inline-block;
            margin: 20px 0 12px;
            background: var(--gold);
            color: var(--purple-dark);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 20px;
        }

        p {
            max-width: 480px;
            opacity: 0.92;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
        }

        .links a {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 999px;
            padding: 10px 20px;
        }

        .links a:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <img src="logo.png" alt="LCCC logo" width="240" height="141" />
    <h1>Luxembourg Cards &amp; Collectibles</h1>
    <span class="badge">New website coming soon</span>
    <p>Luxembourg's convention for trading card games and collectibles is getting a new home online.
        Follow us for the next edition, vendors and giveaways.</p>
    <div class="links">
        <a href="https://www.instagram.com/lccc.tcg/" target="_blank" rel="noopener">Instagram</a>
        <a href="https://discord.gg/DBx5x52tz" target="_blank" rel="noopener">Discord</a>
        <a href="mailto:orga@lccc.lu">orga@lccc.lu</a>
    </div>
    <footer>© LCCC · Luxembourg Cards &amp; Collectibles</footer>
</body>

</html>
